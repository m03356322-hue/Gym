<style>
/* Layout: одна колонка до 520px, липкий счётчик сверху, полноэкранная панель добавления, три вкладки снизу */
:root{
  --bg:#EFEDE7; --surf:#FDFCF9; --surf2:#E9E6DE; --surf3:#DFDBD1;
  --ink:#1A1815; --ink2:#5F5A50; --ink3:#8D877B;
  --line:#D2CDC1; --line2:#E2DED5;
  --acc:#A06C00; --ok:#1E7A4D; --over:#A8341E; --on-acc:#FFFFFF;
  --prot:#3D6B8F;
  --shadow:0 1px 2px rgba(26,24,21,.06),0 6px 16px rgba(26,24,21,.05);
  --f-disp:"Fira Sans Condensed","Helvetica Neue",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,sans-serif;
  --f-mono:"Fira Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --surf:#1D1B17; --surf2:#252218; --surf3:#2E2A20;
  --ink:#EDE9E0; --ink2:#A09889; --ink3:#746D60;
  --line:#332F26; --line2:#262319;
  --acc:#D9A62B; --ok:#4FBF8B; --over:#E0735A; --on-acc:#17150F;
  --prot:#7FB2D9;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.34);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141311; --surf:#1D1B17; --surf2:#252218; --surf3:#2E2A20;
  --ink:#EDE9E0; --ink2:#A09889; --ink3:#746D60;
  --line:#332F26; --line2:#262319;
  --acc:#D9A62B; --ok:#4FBF8B; --over:#E0735A; --on-acc:#17150F;
  --prot:#7FB2D9;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.34);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line2);margin-inline:-16px;padding:11px 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrow h1{font-size:19px}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{width:30px;height:28px;border-radius:7px;color:var(--ink3);font-size:15px;display:grid;place-items:center}
.datenav button[disabled]{opacity:.3}
.datenav .dlab{font-size:12.5px;color:var(--ink2);min-width:74px;text-align:center}

.card{background:var(--surf);border:1px solid var(--line2);border-radius:13px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:13px;padding-block:14px}
.sect{display:flex;flex-direction:column;gap:9px}

/* счётчик */
.meter{padding:15px 15px 14px;display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mbig{display:flex;flex-direction:column;gap:1px;min-width:0}
.mbig .lab{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.mbig .v{font-family:var(--f-disp);font-size:46px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mbig .v.ok{color:var(--ok)} .mbig .v.over{color:var(--over)}
.mbig .u{font-size:15px;font-weight:600;color:var(--ink3);margin-left:4px}
.mside{text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.5;white-space:nowrap}
.mside b{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--ink)}

.track{position:relative;height:16px;border-radius:5px;background:var(--surf3);overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.18;min-width:4px}
.bandline{position:absolute;top:0;bottom:0;width:2px;background:var(--ok);opacity:.7}
.fill{position:absolute;top:0;bottom:0;left:0;background:var(--acc);border-radius:5px 0 0 5px;transition:width .3s}
.fill.ok{background:var(--ok)} .fill.over{background:var(--over)}
.scale{position:relative;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--ink3);margin-top:3px;height:13px}
.scale .gm{position:absolute;transform:translateX(-50%);color:var(--ok);font-weight:700;white-space:nowrap}

.prot{display:flex;align-items:center;gap:10px;padding-top:2px;border-top:1px solid var(--line2);margin-top:1px}
.prot .pl{font-size:12.5px;color:var(--ink2);white-space:nowrap;padding-top:9px}
.prot .pt{flex:1;height:7px;border-radius:999px;background:var(--surf3);overflow:hidden;margin-top:9px;min-width:0}
.prot .pt>i{display:block;height:100%;background:var(--prot);border-radius:999px}
.prot .pv{font-family:var(--f-mono);font-size:13px;font-weight:700;white-space:nowrap;padding-top:9px}

/* список еды */
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 6px 10px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm span{font-size:11.5px;color:var(--ink3);font-family:var(--f-mono)}
.row .kc{font-family:var(--f-mono);font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.row .kc em{font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:500}
.row .kc small{display:block;font-size:10.5px;color:var(--prot);font-weight:500}
.del{width:34px;height:34px;border-radius:8px;color:var(--ink3);font-size:17px;display:grid;place-items:center;flex:none}

function mk(a){ return {id:a[0],n:a[1],k:a[2],p:a[3],d:a[4],pc:a[5],c:a[6]}; }
var BASE=RAW.map(mk);

/* ───────── даты ───────── */
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addD(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function human(s){var d=parseISO(s);return d.getDate()+' '+MON[d.getMonth()];}

/* ───────── состояние ───────── */
var KEY='proficit.v1', S;
function fresh(){ return {v:1, lo:3100, hi:3200, pgoal:140, days:{}, own:[], recent:[]}; }
function load(){
  try{ var r=localStorage.getItem(KEY); if(!r) return null;
    var o=JSON.parse(r); if(!o||o.v!==1) return null;
    if(!o.days)o.days={}; if(!o.own)o.own=[]; if(!o.recent)o.recent=[];
    if(typeof o.lo!=='number')o.lo=3100; if(typeof o.hi!=='number')o.hi=3200;
    if(typeof o.pgoal!=='number')o.pgoal=140;
    return o;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
S=load()||fresh();

function allProducts(){ return BASE.concat(S.own.map(function(o){ o.own=true; return o; })); }
function prodById(id){ var a=allProducts(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }

var tab='day', selDate=iso(today()), weekOff=0;

/* ───────── утилиты ───────── */
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function n0(x){return Math.round(x);}
function n1(x){return (Math.round(x*10)/10).toString().replace('.',',');}
var tT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('show');},3000);}

function dayList(ds){ return S.days[ds]||[]; }
function dayTotals(ds){
  var L=dayList(ds),k=0,p=0;
  for(var i=0;i<L.length;i++){ k+=L[i].k; p+=L[i].p; }
  return {k:k,p:p,n:L.length};
}
function status(k){ return k<S.lo ? 'under' : (k<=S.hi ? 'ok' : 'over'); }

/* ═══════ СЕГОДНЯ ═══════ */
function vDay(){
  var T=dayTotals(selDate), st=status(T.k), h=[];
  var max=Math.max(S.hi*1.18, T.k*1.04, 1);
  var pct=function(x){ return Math.max(0,Math.min(100, x/max*100)); };

  h.push('<div class="card meter"><div class="mtop"><div class="mbig">');
  if(st==='under'){
    h.push('<div class="lab">Осталось</div><div class="v num">'+n0(S.lo-T.k)+'<span class="u">ккал</span></div>');
  } else if(st==='ok'){
    h.push('<div class="lab">Норма набрана</div><div class="v ok num">'+n0(T.k)+'<span class="u">ккал</span></div>');
  } else {
    h.push('<div class="lab">Сверх цели</div><div class="v over num">+'+n0(T.k-S.hi)+'<span class="u">ккал</span></div>');
  }
  h.push('</div><div class="mside">съедено <b class="num">'+n0(T.k)+'</b><br>цель <b class="num">'+S.lo+'–'+S.hi+'</b></div></div>');

  h.push('<div><div class="track">'
    +'<div class="band" style="left:'+pct(S.lo)+'%;width:'+(pct(S.hi)-pct(S.lo))+'%"></div>'
    +'<div class="bandline" style="left:'+pct(S.lo)+'%"></div>'
    +'<div class="fill'+(st==='ok'?' ok':st==='over'?' over':'')+'" style="width:'+pct(T.k)+'%"></div>'
    +'</div><div class="scale"><span>0</span><span class="gm" style="left:'+pct(S.lo)+'%">'+S.lo+'</span><span>'+n0(max)+'</span></div></div>');

  var pp=Math.min(100,T.p/S.pgoal*100);
  h.push('<div class="prot"><div class="pl">Белок</div><div class="pt"><i style="width:'+pp+'%"></i></div>'
    +'<div class="pv">'+n0(T.p)+' / '+S.pgoal+' г</div></div>');
  h.push('</div>');

  h.push('<div class="sect"><div class="eyebrow">Съедено за день</div><div class="card">');
  var L=dayList(selDate);
  if(!L.length){
    h.push('<div class="empty">Пока пусто.<br>Нажми «+ Еда» и добавь первый продукт.</div>');
  } else {
    L.forEach(function(e,i){
      var sub = e.pcs ? n1(e.pcs)+' шт · '+n0(e.g)+' г' : n0(e.g)+' г';
      h.push('<div class="row"><button class="nm" data-edit="'+i+'" style="text-align:left;padding:0;background:none">'
        +'<b>'+esc(e.n)+'</b><span>'+sub+'</span></button>'
        +'<div class="kc">'+n0(e.k)+' <em>ккал</em><small>'+n1(e.p)+' г белка</small></div>'
        +'<button class="del" data-del="'+i+'" aria-label="Удалить">×</button></div>');
    });
  }
  h.push('</div></div>');
  return h.join('');
}

/* ═══════ НЕДЕЛЯ ═══════ */
function vWeek(){
  var m=addD(monday(parseISO(selDate)), weekOff*7), h=[];
  var days=[],sum=0,cnt=0,maxK=0,tIso=iso(today());
  for(var i=0;i<7;i++){
    var ds=iso(addD(m,i)), T=dayTotals(ds);
    days.push({ds:ds,k:T.k,p:T.p});
    if(T.k>0){ sum+=T.k; cnt++; }
    if(T.k>maxK) maxK=T.k;
  }
  var max=Math.max(S.hi*1.15, maxK*1.05, 1);
  var avg=cnt?sum/cnt:0;

  h.push('<div class="sect"><div class="frow"><div class="eyebrow">'+human(iso(m))+' — '+human(iso(addD(m,6)))+'</div>'
    +'<div class="datenav"><button data-wk="-1" aria-label="Предыдущая неделя">‹</button>'
    +'<button data-wk="1" aria-label="Следующая неделя"'+(weekOff>=0?' disabled':'')+'>›</button></div></div>');

  h.push('<div class="card" style="padding:14px 11px 10px">');
  h.push('<div class="chart"><div class="cband" style="bottom:'+(S.lo/max*100)+'%;height:'+((S.hi-S.lo)/max*100)+'%"></div>'
    +'<div class="cline" style="bottom:'+(S.lo/max*100)+'%"></div>'
    +'<div class="clab" style="bottom:'+(S.hi/max*100)+'%">цель '+S.lo+'</div>');
  days.forEach(function(d){
    var cls = d.k===0 ? 'zero' : status(d.k)==='ok' ? 'ok' : status(d.k)==='over' ? 'over' : '';
    h.push('<button class="cbar'+(d.ds===selDate?' sel':'')+'" data-day="'+d.ds+'" aria-label="'+human(d.ds)+'">'
      +'<span class="cv">'+(d.k?n0(d.k):'')+'</span>'
      +'<span class="b '+cls+'" style="height:'+Math.max(1.5,d.k/max*100)+'%"></span></button>');
  });
  h.push('</div><div class="cdays">');
  days.forEach(function(d,i){ h.push('<div'+(d.ds===tIso?' class="now"':'')+'>'+DOW[i]+'</div>'); });
  h.push('</div></div>');

  var pSum=0; days.forEach(function(d){ if(d.k>0) pSum+=d.p; });
  h.push('<div class="avg"><div class="tile"><b class="num">'+(cnt?n0(avg):'—')+'</b><span>ккал, среднее за '+cnt+' дн.</span></div>'
    +'<div class="tile"><b class="num">'+(cnt?n0(pSum/cnt):'—')+'</b><span>белок, г в день</span></div></div>');

  var verdict;
  if(!cnt) verdict='Пока нет данных за эту неделю.';
  else if(avg<S.lo-150) verdict='Средняя ниже цели на '+n0(S.lo-avg)+' ккал. При таком профиците масса расти не будет — добавь калорийной еды: орехи, арахисовая паста, масло в кашу.';
  else if(avg>S.hi+250) verdict='Средняя выше цели на '+n0(avg-S.hi)+' ккал. Если вес растёт быстрее 0,5 кг в неделю, часть прироста идёт в жир.';
  else verdict='Средняя в целевом коридоре. Именно она определяет набор, а не отдельный день — один недобор в неделю ничего не ломает.';
  h.push('<div class="verdict">'+esc(verdict)+'</div>');
  h.push('</div>');

  h.push('<div class="card set"><h3>Цель</h3>'
    +'<div class="frow"><span>Калории, коридор</span><div class="pair">'
    +'<input class="inp" id="gLo" type="number" inputmode="numeric" value="'+S.lo+'" aria-label="Нижняя граница">'
    +'<span>–</span><input class="inp" id="gHi" type="number" inputmode="numeric" value="'+S.hi+'" aria-label="Верхняя граница"></div></div>'
    +'<div class="frow"><span>Белок, г</span><input class="inp" id="gP" type="number" inputmode="numeric" value="'+S.pgoal+'" style="max-width:96px" aria-label="Цель по белку"></div>'
    +'<div class="note">Взвешивайся раз в неделю утром. Вес стоит две недели — подними коридор на 200 ккал.</div></div>');

  h.push('<div class="card set"><h3>Данные</h3>'
    +'<div class="note">Всё хранится в браузере этого телефона. Чистка данных Safari сотрёт историю — делай копию раз в месяц.</div>'
    +'<div class="two"><button class="ghost" id="copy">Скопировать копию</button><button class="ghost" id="showimp">Восстановить</button></div>'
    +'<div id="impbox" hidden><textarea id="imp" placeholder="Вставь сюда скопированный текст" aria-label="Данные для восстановления"></textarea>'
    +'<button class="ghost" id="doimp" style="margin-top:8px">Загрузить и заменить данные</button></div></div>');
  return h.join('');
}

/* ═══════ ПРОДУКТЫ ═══════ */
function vBase(){
  var h=[], all=allProducts(), order=['u','m','d','g','n','v','r','s','a'];
  h.push('<div class="card set"><h3>Свой продукт</h3>'
    +'<input class="inp txt" id="oN" placeholder="Название" aria-label="Название">'
    +'<div class="two"><input class="inp" id="oK" type="number" inputmode="decimal" placeholder="ккал / 100 г" aria-label="Калорийность на 100 г">'
    +'<input class="inp" id="oP" type="number" inputmode="decimal" placeholder="белок / 100 г" aria-label="Белок на 100 г"></div>'
    +'<button class="ghost" id="oAdd">Добавить в базу</button>'
    +'<div class="note">Цифры бери с упаковки — они точнее любого справочника.</div></div>');

  order.forEach(function(c){
    var list=all.filter(function(p){return p.c===c;});
    if(c==='u') list=list.concat(all.filter(function(p){return order.indexOf(p.c)<0;}));
    if(!list.length) return;
    h.push('<div class="sect"><div class="cathead">'+CATS[c]+'</div><div class="card plist">');
    list.forEach(function(p){
      h.push('<div class="row"><div class="nm"><b>'+esc(p.n)+'</b>'
        +'<span>на 100 г'+(p.own?'<span class="mine">своё</span>':'')+'</span></div>'
        +'<div class="kc">'+n0(p.k)+' <em>ккал</em><small>'+n1(p.p)+' г белка</small></div>'
        +(p.own?'<button class="del" data-rm="'+p.id+'" aria-label="Удалить">×</button>':'<span style="width:34px"></span>')
        +'</div>');
    });
    h.push('</div></div>');
  });
  return h.join('');
}

/* ═══════ панель добавления ═══════ */
var sel=null, amt=0, editIdx=-1;

function openSheet(idx){
  editIdx = (typeof idx==='number') ? idx : -1;
  sel=null; amt=0;
  $('#sheet').hidden=false;
  document.body.style.overflow='hidden';
  $('#q').value='';
  if(editIdx>=0){
    var e=dayList(selDate)[editIdx], p=prodById(e.id);
    if(p){ pick(p, e.pcs ? e.pcs : e.g); }
    else { sel={id:e.id,n:e.n,k:e.k/e.g*100,p:e.p/e.g*100,d:e.g,pc:0}; amt=e.g; drawFoot(); }
  } else { drawFoot(); }
  drawList('');
  if(editIdx<0) setTimeout(function(){ try{$('#q').focus();}catch(err){} },90);
}
function closeSheet(){ $('#sheet').hidden=true; document.body.style.overflow=''; sel=null; editIdx=-1; }

function drawList(q){
  q=(q||'').trim().toLowerCase();
  var all=allProducts(), h=[], list;
  if(!q){
    var rec=S.recent.map(prodById).filter(Boolean).slice(0,10);
    if(rec.length){
      h.push('<div class="eyebrow">Часто добавляешь</div><div class="chips">');
      rec.forEach(function(p){ h.push('<button data-p="'+p.id+'">'+esc(p.n)+'</button>'); });
      h.push('</div>');
    }
    list=all.slice(0,200);
    h.push('<div class="eyebrow" style="margin-top:4px">Вся база</div>');
  } else {
    list=all.filter(function(p){ return p.n.toLowerCase().indexOf(q)>=0 || (CATS[p.c]||'').toLowerCase().indexOf(q)>=0; });
    if(!list.length) h.push('<div class="empty">Ничего не нашлось. Добавь свой продукт во вкладке «Продукты».</div>');
  }
  if(list.length){
    h.push('<div class="card">');
    list.forEach(function(p){
      h.push('<button class="row" data-p="'+p.id+'"><div class="nm"><b>'+esc(p.n)+'</b><span>'+n0(p.k)+' ккал / 100 г</span></div>'
        +'<div class="kc">'+n1(p.p)+' <em>г белка</em></div><span style="width:8px"></span></button>');
    });
    h.push('</div>');
  }
  $('#shlist').innerHTML=h.join('');
}

function pick(p, preset){
  sel=p;
  amt = (typeof preset==='number') ? preset : (p.pc ? Math.max(1,Math.round(p.d/p.pc)) : p.d);
  drawFoot();
}

function calc(){
  if(!sel) return {g:0,k:0,p:0};
  var g = sel.pc ? amt*sel.pc : amt;
  return {g:g, k:sel.k*g/100, p:sel.p*g/100};
}

function drawFoot(){
  var f=$('#shfoot');
  if(!sel){ f.hidden=true; return; }
  f.hidden=false;
  var isPc=!!sel.pc, unit=isPc?'шт':'г', c=calc(), h=[];
  var chips = isPc ? [1,2,3,4] : [Math.round(sel.d*0.5/5)*5, sel.d, Math.round(sel.d*1.5/5)*5, sel.d*2];
  chips=chips.filter(function(v,i,a){return v>0 && a.indexOf(v)===i;});

  h.push('<div class="fname"><b>'+esc(sel.n)+'</b><span>'+n0(sel.k)+' ккал / 100 г</span></div>');
  h.push('<div class="chips">');
  chips.forEach(function(v){ h.push('<button data-amt="'+v+'">'+v+' '+unit+'</button>'); });
  h.push('</div>');
  h.push('<div class="amt"><button data-step="-1" aria-label="Меньше">−</button>'
    +'<div class="field"><input id="amtIn" type="number" inputmode="decimal" value="'+amt+'" aria-label="Количество"><span>'+unit+'</span></div>'
    +'<button data-step="1" aria-label="Больше">+</button></div>');
  h.push('<div class="preview"><b>'+n0(c.k)+' ккал</b> · '+n1(c.p)+' г белка'+(isPc?' · '+n0(c.g)+' г':'')+'</div>');
  h.push('<button class="big" id="doadd">'+(editIdx>=0?'Сохранить':'Добавить')+'</button>');
  $('#shfootin').innerHTML=h.join('');
}

function commit(){
  if(!sel || !(amt>0)) return;
  var c=calc();
  var entry={id:sel.id,n:sel.n,g:c.g,k:c.k,p:c.p};
  if(sel.pc) entry.pcs=amt;
  if(!S.days[selDate]) S.days[selDate]=[];
  if(editIdx>=0) S.days[selDate][editIdx]=entry;
  else S.days[selDate].push(entry);
  var r=S.recent.filter(function(x){return x!==sel.id;});
  r.unshift(sel.id); S.recent=r.slice(0,12);
  save(); closeSheet(); render();
  var T=dayTotals(selDate), left=S.lo-T.k;
  toast(left>0 ? 'Записал. До цели ещё '+n0(left)+' ккал.' : 'Записал. Коридор на сегодня закрыт.');
}

/* ───────── роутер ───────── */
function render(){
  var v=$('#view');
  v.innerHTML = tab==='day' ? vDay() : tab==='week' ? vWeek() : vBase();
  $('#h-title').textContent = tab==='day' ? (selDate===iso(today())?'Сегодня':DOW[(parseISO(selDate).getDay()+6)%7]) : tab==='week' ? 'Неделя' : 'Продукты';
  $('#dlab').textContent = human(selDate);
  $('#dnav').hidden = tab!=='day';
  $('#addbtn').hidden = tab!=='day';
  var btns=document.querySelectorAll('#nav button');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('data-tab')===tab) btns[i].setAttribute('aria-current','page');
    else btns[i].removeAttribute('aria-current');
  }
}

document.getElementById('nav').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-tab]'); if(!b) return;
  tab=b.getAttribute('data-tab'); if(tab==='week') weekOff=0;
  window.scrollTo(0,0); render();
});

document.addEventListener('click',function(ev){
  var t=ev.target,b;

  if(t.closest('#addbtn')){ openSheet(); return; }
  if(t.closest('#shx')){ closeSheet(); return; }
  if((b=t.closest('[data-p]'))){ var p=prodById(b.getAttribute('data-p')); if(p) pick(p); return; }
  if((b=t.closest('[data-amt]'))){ amt=+b.getAttribute('data-amt'); drawFoot(); return; }
  if((b=t.closest('[data-step]'))){
    var dir=+b.getAttribute('data-step'), st = sel&&sel.pc ? 1 : (amt>=200?25:10);
    amt=Math.max(sel&&sel.pc?0.5:5, Math.round((amt+dir*st)*2)/2); drawFoot(); return;
  }
  if(t.closest('#doadd')){ commit(); return; }

  if((b=t.closest('[data-del]'))){
    var i=+b.getAttribute('data-del');
    S.days[selDate].splice(i,1);
    if(!S.days[selDate].length) delete S.days[selDate];
    save(); render(); return;
  }
  if((b=t.closest('[data-edit]'))){ openSheet(+b.getAttribute('data-edit')); return; }

  if((b=t.closest('[data-nav]'))){
    selDate=iso(addD(parseISO(selDate), +b.getAttribute('data-nav')));
    render(); return;
  }
  if((b=t.closest('[data-wk]'))){ weekOff+=(+b.getAttribute('data-wk')); if(weekOff>0)weekOff=0; render(); return; }
  if((b=t.closest('[data-day]'))){ selDate=b.getAttribute('data-day'); tab='day'; weekOff=0; window.scrollTo(0,0); render(); return; }

  if(t.closest('#oAdd')){
    var nm=$('#oN').value.trim(), kk=parseFloat($('#oK').value), pp=parseFloat($('#oP').value);
    if(!nm || !(kk>=0)){ toast('Нужно название и калорийность на 100 г.'); return; }
    S.own.push({id:'u'+Date.now(), n:nm, k:kk, p:(pp>=0?pp:0), d:100, pc:0, c:'u'});
    $('#oN').value=''; $('#oK').value=''; $('#oP').value='';
    save(); render(); toast('«'+nm+'» в базе.'); return;
  }
  if((b=t.closest('[data-rm]'))){
    var rid=b.getAttribute('data-rm');
    S.own=S.own.filter(function(o){return o.id!==rid;});
    save(); render(); return;
  }

  if(t.closest('#copy')){
    var txt=JSON.stringify(S);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('Копия в буфере. Сохрани её в заметки.');},function(){fallback(txt);});
    } else fallback(txt);
    return;
  }
  if(t.closest('#showimp')){ var ib=$('#impbox'); ib.hidden=!ib.hidden; return; }
  if(t.closest('#doimp')){
    try{ var o=JSON.parse($('#imp').value); if(!o||o.v!==1||!o.days) throw 0;
      S=o; save(); render(); toast('Данные восстановлены.');
    }catch(e){ toast('Не получилось прочитать текст. Проверь, что скопировал его целиком.'); }
    return;
  }
});

function fallback(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  toast('Копия выделена — нажми «Скопировать» в меню.');
  setTimeout(function(){document.body.removeChild(ta);},12000);
}

document.addEventListener('input',function(ev){
  var id=ev.target.id;
  if(id==='q'){ drawList(ev.target.value); return; }
  if(id==='amtIn'){
    amt=parseFloat(ev.target.value)||0;
    var c=calc(), pv=$('#shfootin .preview');
    if(pv) pv.innerHTML='<b>'+n0(c.k)+' ккал</b> · '+n1(c.p)+' г белка'+(sel&&sel.pc?' · '+n0(c.g)+' г':'');
    return;
  }
  if(id==='gLo'||id==='gHi'||id==='gP'){
    var lo=parseInt($('#gLo').value,10), hi=parseInt($('#gHi').value,10), pg=parseInt($('#gP').value,10);
    if(lo>0) S.lo=lo; if(hi>0) S.hi=hi; if(pg>0) S.pgoal=pg;
    if(S.hi<S.lo) S.hi=S.lo;
    save(); return;
  }
});

document.addEventListener('keydown',function(ev){ if(ev.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

render();
})();
</script>

</body>
</html>
