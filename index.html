html{-webkit-text-size-adjust:100%}

<style>
/* Layout: одна колонка до 520px, липкая шапка блока, фиксированная нижняя панель вкладок */
:root{
  --bg:#E7EAEE; --surf:#FFFFFF; --surf2:#F0F3F7; --surf3:#E3E8ED;
  --ink:#0E141A; --ink2:#59656F; --ink3:#8995A0;
  --line:#CCD4DC; --line2:#DEE4EA;
  --acc:#1A5CB0; --accB:#0D7A69; --on-acc:#FFFFFF;
  --good:#1C6B46; --on-good:#FFFFFF; --warn:#8A5A00;
  --shadow:0 1px 2px rgba(14,20,26,.07),0 6px 16px rgba(14,20,26,.05);
  --plate-white:#F3F6F9; --plate-chrome:#A9B3BC;
  --f-disp:"Oswald","Oswald Fallback",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surf:#171D22; --surf2:#1D242A; --surf3:#242D34;
  --ink:#E6EBEF; --ink2:#95A1AB; --ink3:#6C7883;
  --line:#28313A; --line2:#222A31;
  --acc:#5E9BF0; --accB:#2FC2A8; --on-acc:#0B1116;
  --good:#4FBF8B; --on-good:#0B1116; --warn:#D9A441;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.32);
  --plate-white:#DFE5EA; --plate-chrome:#8C97A1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surf:#171D22; --surf2:#1D242A; --surf3:#242D34;
  --ink:#E6EBEF; --ink2:#95A1AB; --ink3:#6C7883;
  --line:#28313A; --line2:#222A31;
  --acc:#5E9BF0; --accB:#2FC2A8; --on-acc:#0B1116;
  --good:#4FBF8B; --on-good:#0B1116; --warn:#D9A441;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.32);
  --plate-white:#DFE5EA; --plate-chrome:#8C97A1;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 calc(78px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-disp);font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}

/* ── шапка ─────────────────────────────── */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line2);
  margin-inline:-16px; padding:12px 16px 10px;
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hrow h1{font-size:21px;line-height:1.1}
.hmeta{font-size:12px;color:var(--ink2);white-space:nowrap}
.bar{height:4px;border-radius:999px;background:var(--surf3);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .3s}

/* ── карточки ──────────────────────────── */
.card{background:var(--surf);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.sect{display:flex;flex-direction:column;gap:9px}
.sect>.eyebrow{margin-bottom:-2px}

/* ── сегмент A/B ───────────────────────── */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surf3);border-radius:11px}
.seg button{padding:9px 6px;border-radius:8px;text-align:center;font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}
.seg b{display:block;font-size:19px;line-height:1.1}

/* ── упражнение ────────────────────────── */
.ex{padding:13px 14px;display:flex;flex-direction:column;gap:11px}
.ex.full{border-color:var(--good)}
.ex-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-n{font-family:var(--f-disp);font-size:16px;font-weight:500;line-height:1.2;min-width:0}
.ex-t{font-size:11.5px;color:var(--ink3);white-space:nowrap;padding-top:3px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ctrl{background:var(--surf2);border-radius:10px;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.ctrl .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.ctrl .row{display:flex;align-items:center;gap:2px;width:100%;justify-content:space-between}
.step{width:34px;height:30px;border-radius:8px;background:var(--surf);border:1px solid var(--line);font-size:17px;line-height:1;color:var(--ink2);display:grid;place-items:center;flex:none}
.step:active{background:var(--surf3)}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;flex:1;text-align:center;min-width:0}
.val small{font-size:11px;font-weight:500;color:var(--ink3);margin-left:1px}
.bwtag{font-size:12px;color:var(--ink3);text-align:center;padding:8px 0}
.sets{display:flex;gap:7px}
.set{flex:1;height:46px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:all .15s}
.set small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.set b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.set.on{border-style:solid;border-color:transparent;background:var(--good);color:var(--on-good)}
.note{font-size:12.5px;line-height:1.45;color:var(--ink2);border-left:2px solid var(--line);padding-left:9px}

.big{width:100%;padding:14px;border-radius:12px;background:var(--acc);color:var(--on-acc);font-family:var(--f-disp);font-size:15px;letter-spacing:.07em;text-transform:uppercase;box-shadow:var(--shadow)}
.big[disabled]{background:var(--surf3);color:var(--ink3);box-shadow:none}
.ghost{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-size:13.5px;color:var(--ink2)}

/* ── сетка 12 недель ───────────────────── */
.gridhead,.gridrow{display:grid;grid-template-columns:30px repeat(7,1fr) 26px;gap:3px;align-items:center}
.gridhead span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center}
.gridrow{margin-top:3px}
.wk{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);text-align:right;padding-right:2px}
.cell{aspect-ratio:1;border-radius:7px;background:var(--surf2);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-disp);font-size:13px;font-weight:600;color:var(--ink3);padding:0;min-width:0}
.cell.future{opacity:.45}
.cell.today{border-color:var(--acc);border-width:1.5px}
.cell.A{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.cell.B{background:var(--accB);border-color:var(--accB);color:var(--on-acc)}
.cell .d{font-family:var(--f-mono);font-size:10px;font-weight:500;opacity:.65}

.barsel{display:flex;gap:4px;padding:3px;background:var(--surf3);border-radius:9px}

.plates{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px}

textarea{width:100%;min-height:88px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);font-family:var(--f-mono);font-size:11px;color:var(--ink);resize:vertical}

  background:var(--surf);

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ───────── программа ───────── */
var PROG = {
  A:{ tag:'A', sub:'Присед · Жим · Тяга сверху', ex:[
    {id:'sq', n:'Приседания со штангой',        s:3, r:[6,8],   st:5,   w0:40, rest:'2–3 мин', note:'При росте 190 бёдра длинные — ставь ноги шире плеч, носки слегка врозь. Опускайся до параллели бедра с полом, поясница нейтральная.'},
    {id:'bp', n:'Жим штанги лёжа',              s:3, r:[6,8],   st:2.5, w0:30, rest:'2–3 мин', note:'Длинные руки дают амплитуду больше средней, поэтому жим пойдёт медленнее приседа. Хват чуть шире плеч, лопатки сведены и прижаты к скамье.'},
    {id:'pd', n:'Тяга верхнего блока к груди',  s:3, r:[8,12],  st:5,   w0:35, rest:'90 сек', note:'Как сделаешь 12 чистых повторов с весом, близким к своему, — переходи на подтягивания.'},
    {id:'ohp',n:'Жим гантелей сидя',            s:3, r:[8,12],  st:2,   w0:10, pair:true, rest:'90 сек'},
    {id:'pl', n:'Планка',                       s:3, r:[40,60], st:0,   w0:0,  bw:true, unit:'сек', rest:'60 сек'}
  ]},
  B:{ tag:'B', sub:'Становая · Наклонный жим · Тяга в наклоне', ex:[
    {id:'dl', n:'Становая тяга',                s:3, r:[5,5],   st:5,   w0:50, rest:'3 мин',  note:'Здесь длинные руки — преимущество. Штанга скользит по голени и бедру, таз не взлетает раньше груди.'},
    {id:'ib', n:'Жим гантелей на наклонной',    s:3, r:[8,10],  st:2,   w0:12, pair:true, rest:'2 мин'},
    {id:'br', n:'Тяга штанги в наклоне',        s:3, r:[8,10],  st:2.5, w0:30, rest:'2 мин', note:'Корпус около 45°, спина прямая. Если поясница устаёт раньше спины — замени тягой горизонтального блока.'},
    {id:'lu', n:'Болгарские выпады',            s:3, r:[10,12], st:2,   w0:0,  pair:true, rest:'90 сек', note:'Счёт повторов — на каждую ногу. Начни с собственного веса, потом бери гантели.'},
    {id:'bc', n:'Подъём штанги на бицепс',      s:3, r:[10,12], st:2.5, w0:15, rest:'60 сек'}
  ]}
};
var ALL = PROG.A.ex.concat(PROG.B.ex);
function exById(id){ for(var i=0;i<ALL.length;i++) if(ALL[i].id===id) return ALL[i]; return null; }
function wkOf(id){ for(var k in PROG){ for(var i=0;i<PROG[k].ex.length;i++) if(PROG[k].ex[i].id===id) return k; } return 'A'; }

/* ───────── даты ───────── */
function iso(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addD(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function monday(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function today(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function human(s){ var d=parseISO(s); return d.getDate()+' '+MON[d.getMonth()]; }

/* ───────── состояние ───────── */
var KEY='massa190.v1';
var S;
function fresh(){
  var w={}, r={};
  for(var i=0;i<ALL.length;i++){ w[ALL[i].id]=ALL[i].w0; r[ALL[i].id]=ALL[i].r[0]; }
  return { v:1, start:iso(monday(today())), w:w, reps:r, days:{}, cur:null, hint:1, bar:20 };
}
function load(){
  try{ var raw=localStorage.getItem(KEY); if(!raw) return null;
    var o=JSON.parse(raw); if(!o||o.v!==1) return null;
    var f=fresh();
    for(var i=0;i<ALL.length;i++){ var id=ALL[i].id;
      if(typeof o.w[id]!=='number') o.w[id]=f.w[id];
      if(typeof o.reps[id]!=='number') o.reps[id]=f.reps[id];
    }
    if(!o.days) o.days={}; if(typeof o.bar!=='number') o.bar=20;
    return o;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
S = load() || fresh();
if(S.cur && S.cur.date !== iso(today())) S.cur = null;

/* ───────── утилиты ───────── */
var $ = function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function kg(n){ return (Math.round(n*100)/100).toString().replace(/\.0+$/,'').replace('.',','); }
var toastT;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); }, 3400);
}

/* ───────── блок 12 недель ───────── */
function blockStart(){ return parseISO(S.start); }
function weekIndex(d){ return Math.floor((monday(d)-blockStart())/604800000); }
function doneCount(){ var n=0; for(var k in S.days) n++; return n; }
function weekTally(i){
  var m=addD(blockStart(), i*7), n=0;
  for(var j=0;j<7;j++) if(S.days[iso(addD(m,j))]) n++;
  return n;
}
function streak(){
  var cw=weekIndex(today()), n=0;
  for(var i=cw;i>=0;i--){ var t=weekTally(i); if(t>=2) n++; else if(i<cw) break; }
  return n;
}
function nextType(){
  var ks=Object.keys(S.days).sort();
  if(!ks.length) return 'A';
  return S.days[ks[ks.length-1]].t==='A' ? 'B' : 'A';
}

/* ───────── шапка ───────── */
function header(){
  var wi=Math.max(0,Math.min(11,weekIndex(today())));
  $('#h-meta').textContent='Неделя '+(wi+1)+' из 12 · '+weekTally(wi)+'/3';
  $('#h-bar').style.width=(((wi+ Math.min(weekTally(wi),3)/3)/12)*100).toFixed(1)+'%';
}

/* ═══════ вкладка: ТРЕНИРОВКА ═══════ */
function vTrain(){
  var t = S.cur ? S.cur.t : nextType();
  if(!S.cur || S.cur.date!==iso(today())) ; // текущая сессия ниже
  var h=[];

  if(S.hint){
    h.push('<div class="hintbox"><div>Веса ниже — стартовые ориентиры, не твои цифры. На первой тренировке подбери такой вес, чтобы последний повтор был на 2–3 в запасе, и поставь его кнопками.</div><button id="hintx" aria-label="Скрыть">×</button></div>');
  }

  h.push('<div class="seg" role="group" aria-label="Выбор тренировки">');
  ['A','B'].forEach(function(k){
    h.push('<button data-pick="'+k+'" aria-pressed="'+(k===t)+'"><b>'+k+'</b>'+esc(PROG[k].sub.split(' · ')[0])+'</button>');
  });
  h.push('</div>');

  var cur = (S.cur && S.cur.t===t) ? S.cur : null;
  var ex = PROG[t].ex, total=0, ticked=0;

  h.push('<div class="sect"><div class="eyebrow">'+esc(PROG[t].sub)+'</div>');
  ex.forEach(function(e){
    var marks = (cur && cur.sets[e.id]) || [];
    var on=0; for(var i=0;i<e.s;i++) if(marks[i]) on++;
    total+=e.s; ticked+=on;
    var w=S.w[e.id], r=S.reps[e.id];
    h.push('<div class="card ex'+(on===e.s?' full':'')+'">');
    h.push('<div class="ex-top"><div class="ex-n">'+esc(e.n)+'</div><div class="ex-t">'+e.s+'×'+(e.r[0]===e.r[1]?e.r[0]:e.r[0]+'–'+e.r[1])+(e.unit?' '+e.unit:'')+'<br>отдых '+e.rest+'</div></div>');

    h.push('<div class="ctrls">');
    if(e.bw){
      h.push('<div class="ctrl"><div class="lab">Вес</div><div class="bwtag">свой вес</div></div>');
    } else {
      h.push('<div class="ctrl"><div class="lab">'+(e.pair?'Вес / гантель':'Вес')+'</div><div class="row">'
        +'<button class="step" data-w="'+e.id+'" data-dir="-1" aria-label="Меньше">−</button>'
        +'<span class="val">'+kg(w)+'<small>кг</small></span>'
        +'<button class="step" data-w="'+e.id+'" data-dir="1" aria-label="Больше">+</button></div></div>');
    }
    h.push('<div class="ctrl"><div class="lab">'+(e.unit==='сек'?'Секунды':'Повторы')+'</div><div class="row">'
      +'<button class="step" data-r="'+e.id+'" data-dir="-1" aria-label="Меньше">−</button>'
      +'<span class="val">'+r+'</span>'
      +'<button class="step" data-r="'+e.id+'" data-dir="1" aria-label="Больше">+</button></div></div>');
    h.push('</div>');

    h.push('<div class="sets">');
    for(var i=0;i<e.s;i++){
      h.push('<button class="set'+(marks[i]?' on':'')+'" data-set="'+e.id+'" data-i="'+i+'" aria-pressed="'+(!!marks[i])+'">'
        +'<small>подход '+(i+1)+'</small>'
        +'<b>'+(marks[i]? marks[i].r+(e.unit==='сек'?'с':'') : '—')+'</b></button>');
    }
    h.push('</div>');
    if(e.note) h.push('<div class="note">'+esc(e.note)+'</div>');
    h.push('</div>');
  });
  h.push('</div>');

  h.push('<button class="big" id="finish"'+(ticked?'':' disabled')+'>'
    + (ticked ? 'Завершить · '+ticked+' из '+total+' подходов' : 'Отметь первый подход')+'</button>');
  if(ticked) h.push('<button class="ghost" id="scrap">Сбросить эту тренировку</button>');

  return h.join('');
}

function ensureCur(t){
  if(!S.cur || S.cur.t!==t || S.cur.date!==iso(today())){
    S.cur={ t:t, date:iso(today()), sets:{} };
  }
  return S.cur;
}

function finish(){
  var c=S.cur; if(!c) return;
  var ex=PROG[c.t].ex, log={}, bumps=[];
  ex.forEach(function(e){
    var marks=c.sets[e.id]||[], n=0, reps=[];
    for(var i=0;i<e.s;i++) if(marks[i]){ n++; reps.push(marks[i].r); }
    if(!n) return;
    log[e.id]={ w:S.w[e.id], n:n, r:reps };
    var lowest=Math.min.apply(null,reps);
    if(n===e.s && lowest>=e.r[1] && e.st>0){
      S.w[e.id]=Math.round((S.w[e.id]+e.st)*100)/100;
      S.reps[e.id]=e.r[0];
      bumps.push(e.n.split(' ')[0].toLowerCase()+' +'+kg(e.st));
    }
  });
  S.days[c.date]={ t:c.t, log:log };
  S.cur=null; save();
  render();
  toast(bumps.length ? 'Записал. На следующий раз: '+bumps.join(', ')+' кг.' : 'Записал. Добей верх диапазона во всех подходах — и вес вырастет сам.');
}

/* ═══════ вкладка: ГРАФИК ═══════ */
var selDay=null;
function vGrid(){
  var h=[], tI=weekIndex(today()), tIso=iso(today());

  h.push('<div class="stats">'
    +'<div class="stat"><b class="num">'+doneCount()+'</b><span>всего</span></div>'
    +'<div class="stat"><b class="num">'+streak()+'</b><span>недель подряд</span></div>'
    +'<div class="stat"><b class="num">'+weekTally(Math.max(0,tI))+'</b><span>на неделе</span></div>'
    +'</div>');

  h.push('<div class="card" style="padding:13px 11px">');
  h.push('<div class="gridhead"><span></span>'+DOW.map(function(d){return '<span>'+d+'</span>';}).join('')+'<span></span></div>');
  for(var i=0;i<12;i++){
    var m=addD(blockStart(), i*7), tal=weekTally(i);
    h.push('<div class="gridrow"><div class="wk">'+(i+1)+'</div>');
    for(var j=0;j<7;j++){
      var d=addD(m,j), ds=iso(d), rec=S.days[ds], fut=ds>tIso;
      var cls='cell'+(rec?' '+rec.t:'')+(fut?' future':'')+(ds===tIso?' today':'');
      h.push('<button class="'+cls+'" data-day="'+ds+'"'+(fut?' disabled':'')+' aria-label="'+DOW[j]+' '+human(ds)+'">'
        + (rec ? rec.t : '<span class="d">'+d.getDate()+'</span>') +'</button>');
    }
    h.push('<div class="tally'+(tal>=2?' ok':'')+'">'+tal+'</div></div>');
  }
  h.push('</div>');

  h.push('<div class="legend">'
    +'<span><i style="background:var(--acc)"></i>Тренировка A</span>'
    +'<span><i style="background:var(--accB)"></i>Тренировка B</span>'
    +'<span><i style="background:var(--surf2);border:1px solid var(--line)"></i>Пропуск</span>'
    +'<span>Цель — 2–3 клетки в строке</span></div>');

  var ds = selDay || tIso;
  var rec = S.days[ds];
  h.push('<div class="card day">');
  h.push('<div class="dh"><b>'+DOW[(parseISO(ds).getDay()+6)%7]+', '+human(ds)+'</b><span class="eyebrow">'+(rec?'отмечено':'не отмечено')+'</span></div>');
  h.push('<div class="pick">'
    +'<button class="aA" data-mark="A" data-d="'+ds+'" aria-pressed="'+(rec&&rec.t==='A')+'">A</button>'
    +'<button class="aB" data-mark="B" data-d="'+ds+'" aria-pressed="'+(rec&&rec.t==='B')+'">B</button>'
    +'<button data-mark="" data-d="'+ds+'">Убрать</button></div>');
  if(rec && rec.log && Object.keys(rec.log).length){
    for(var id in rec.log){
      var e=exById(id); if(!e) continue;
      var L=rec.log[id];
      h.push('<div class="logline"><span>'+esc(e.n)+'</span><b class="num">'+(e.bw?'':kg(L.w)+' кг × ')+L.r.join('/')+'</b></div>');
    }
  } else {
    h.push('<div class="calcnote">Нажми клетку в сетке, чтобы отметить или открыть другой день.</div>');
  }
  h.push('</div>');
  return h.join('');
}

/* ═══════ вкладка: ВЕСА ═══════ */
function history(id){
  var ks=Object.keys(S.days).sort(), out=[];
  for(var i=0;i<ks.length;i++){ var L=S.days[ks[i]].log; if(L && L[id]) out.push(L[id].w); }
  return out;
}
function spark(vals){
  var w=64,h=22;
  if(vals.length<2) return '<span class="dash">—</span>';
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rg=(mx-mn)||1, pts=[];
  for(var i=0;i<vals.length;i++) pts.push([2+i*(w-4)/(vals.length-1), h-3-((vals[i]-mn)/rg)*(h-6)]);
  var d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area=d+' L '+pts[pts.length-1][0].toFixed(1)+' '+h+' L '+pts[0][0].toFixed(1)+' '+h+' Z';
  var l=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true">'
    +'<path d="'+area+'" fill="var(--acc)" opacity=".13"/>'
    +'<path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="2.4" fill="var(--acc)"/></svg>';
}
var PLATES=[25,20,15,10,5,2.5,1.25];
var PCOL={25:'#D21F26',20:'#1F49A8',15:'#E3B000',10:'#1E8A3C',5:'var(--plate-white)',2.5:'#D21F26',1.25:'var(--plate-chrome)'};
function stack(target,bar){
  var per=(target-bar)/2;
  if(per<0) return {err:'Меньше грифа'};
  var out=[], left=Math.round(per*100)/100;
  for(var i=0;i<PLATES.length;i++){
    while(left >= PLATES[i]-0.001){ out.push(PLATES[i]); left=Math.round((left-PLATES[i])*100)/100; }
  }
  return { list:out, rest:left, per:per };
}
function vLoad(){
  var h=[];
  h.push('<div class="sect"><div class="eyebrow">Рабочие веса</div><div class="card">');
  ALL.forEach(function(e){
    var hist=history(e.id), first=hist.length?hist[0]:null, now=S.w[e.id];
    var dlt=(first!==null && now>first) ? '+'+kg(now-first)+' кг' : '';
    h.push('<div class="wrow"><div class="nm"><b>'+esc(e.n)+'</b><span>'+wkOf(e.id)+' · '+e.s+'×'+(e.r[0]===e.r[1]?e.r[0]:e.r[0]+'–'+e.r[1])+(e.pair?' · на гантель':'')+'</span></div>'
      + spark(hist)
      + '<div class="kg">'+(e.bw?'<em>свой вес</em>':kg(now)+' <em>кг</em>')+(dlt?'<span class="delta">'+dlt+'</span>':'')+'</div></div>');
  });
  h.push('</div></div>');

  var tgt = S.calcT || 60, bar=S.bar;
  var st = stack(tgt,bar);
  h.push('<div class="sect"><div class="eyebrow">Блины на штангу</div><div class="card calc">');
  h.push('<div class="calcrow"><input type="number" id="calcT" inputmode="decimal" step="2.5" min="0" value="'+tgt+'" aria-label="Вес штанги целиком, кг">'
    +'<div class="barsel" role="group" aria-label="Гриф"><button data-bar="20" aria-pressed="'+(bar===20)+'">20</button><button data-bar="15" aria-pressed="'+(bar===15)+'">15</button></div></div>');
  h.push('<div class="plates">');
  if(st.err){ h.push('<div class="calcnote">'+st.err+'</div>'); }
  else if(!st.list.length){ h.push('<div class="calcnote">Пустой гриф.</div>'); }
  else {
    st.list.forEach(function(p){
      var light = (p===5 || p===1.25);
      h.push('<div class="plate'+(light?' light':'')+'" style="background:'+PCOL[p]+';height:'+(26+Math.min(p,25)*0.62).toFixed(0)+'px">'+kg(p)+'</div>');
    });
  }
  h.push('</div>');
  h.push('<div class="calcnote">'+(st.err?'Гриф весит '+bar+' кг.':'По '+kg(st.per)+' кг на сторону'+(st.rest>0.01?' · не хватает '+kg(st.rest)+' кг — округли до '+kg(tgt-st.rest*2):'')+'. Цвета — стандарт IWF: красный 25, синий 20, жёлтый 15, зелёный 10, белый 5.')+'</div>');
  h.push('</div></div>');
  return h.join('');
}

/* ═══════ вкладка: ПЛАН ═══════ */
function vPlan(){
  var h=[];
  ['A','B'].forEach(function(k){
    h.push('<div class="card plan"><h3>Тренировка '+k+'</h3><div class="eyebrow">'+esc(PROG[k].sub)+'</div>');
    PROG[k].ex.forEach(function(e){
      h.push('<div class="pl"><i>'+esc(e.n)+'</i><b>'+e.s+'×'+(e.r[0]===e.r[1]?e.r[0]:e.r[0]+'–'+e.r[1])+(e.unit?' '+e.unit:'')+'</b></div>');
    });
    h.push('<div class="calcnote">Перед первым упражнением — 5 минут общей разминки и 2 лёгких подхода с пустым грифом.</div></div>');
  });

  h.push('<div class="card plan"><h3>Как это работает</h3>'
    +'<div class="rule"><b>1</b><div>Чередуй A и B. Два раза в неделю — A, B, потом A, B. Три раза — A, B, A, затем B, A, B. Между тренировками минимум день отдыха.</div></div>'
    +'<div class="rule"><b>2</b><div>Вес подбирается так, чтобы на последнем подходе оставалось 2–3 повтора в запасе. Это не «до отказа».</div></div>'
    +'<div class="rule"><b>3</b><div>Сделал верхнюю границу повторов во всех подходах — приложение само добавит вес к следующему разу: +5 кг в приседе и становой, +2,5 кг в жиме и тягах, +2 кг на гантель. Повторы при этом откатываются к нижней границе диапазона.</div></div>'
    +'<div class="rule"><b>4</b><div>Застрял на одном весе три тренировки подряд — сбрось 10 % и зайди на него заново. Это нормальная часть цикла, а не провал.</div></div>'
    +'<div class="rule"><b>5</b><div>После 12 недель — неделя полегче: те же упражнения, но вес минус 40 % и по два подхода. Потом новый блок.</div></div></div>');

  h.push('<div class="card plan"><h3>Под рост 190</h3>'
    +'<div class="calcnote">Длинные рычаги означают большую амплитуду в каждом повторе: жим и присед пойдут медленнее, чем у человека ростом 175, и это ожидаемо, а не отставание. Становая, наоборот, твоё упражнение — длинные руки сокращают путь штанги. Первые 3–4 недели держи веса заведомо лёгкими и трать их на технику: глубину приседа, положение лопаток в жиме, нейтральную спину в тяге. Если в приседе не получается сесть до параллели без округления поясницы — ставь ноги шире и подкладывай блины 2,5 см под пятки.</div></div>');

  h.push('<div class="card plan"><h3>Еда под набор</h3>'
    +'<div class="kv">'
    +'<b>≈3100 ккал</b><span>в день — это примерно +350 к поддержке при 77 кг, росте 190 и 2–3 тренировках</span>'
    +'<b>≈140 г</b><span>белка в день, то есть 1,8 г на килограмм веса</span>'
    +'<b>+0,3 кг</b><span>в неделю — целевой темп; быстрее — это в основном жир</span>'
    +'</div>'
    +'<div class="calcnote">Взвешивайся раз в неделю утром. Если две недели вес стоит — добавь 200 ккал. Если растёт быстрее 0,5 кг в неделю — убери 200. Цифры выше рассчитаны по формуле Миффлина и являются ориентиром, а не предписанием.</div></div>');

  h.push('<div class="card plan"><h3>Данные</h3>'
    +'<div class="calcnote">Всё хранится прямо в браузере на этом устройстве. Чистка данных Safari стирает историю — делай копию раз в месяц.</div>'
    +'<div class="two"><button class="ghost" id="copy">Скопировать копию</button><button class="ghost" id="showimp">Восстановить</button></div>'
    +'<div id="impbox" hidden><textarea id="imp" placeholder="Вставь сюда скопированный текст" aria-label="Данные для восстановления"></textarea><button class="ghost" id="doimp" style="margin-top:8px">Загрузить и заменить текущие данные</button></div>'
    +'</div>');
  return h.join('');
}

/* ───────── роутер ───────── */
var tab='train';
function render(){
  header();
  var v=$('#view');
  v.innerHTML = tab==='train' ? vTrain() : tab==='grid' ? vGrid() : tab==='load' ? vLoad() : vPlan();
  var btns=document.querySelectorAll('#nav button');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('data-tab')===tab) btns[i].setAttribute('aria-current','page');
    else btns[i].removeAttribute('aria-current');
  }
  $('#h-title').textContent = tab==='train' ? 'Тренировка' : tab==='grid' ? 'График' : tab==='load' ? 'Веса' : 'План';
}

document.getElementById('nav').addEventListener('click', function(ev){
  var b=ev.target.closest('button[data-tab]'); if(!b) return;
  tab=b.getAttribute('data-tab'); window.scrollTo(0,0); render();
});

document.addEventListener('click', function(ev){
  var t=ev.target, b;

  if((b=t.closest('#hintx'))){ S.hint=0; save(); render(); return; }

  if((b=t.closest('[data-pick]'))){
    var k=b.getAttribute('data-pick');
    if(S.cur && S.cur.t!==k){ S.cur=null; }
    ensureCur(k); save(); render(); return;
  }

  if((b=t.closest('[data-w]'))){
    var id=b.getAttribute('data-w'), e=exById(id), dir=+b.getAttribute('data-dir');
    var stp = e.st>0 ? e.st : 2.5;
    S.w[id]=Math.max(0, Math.round((S.w[id]+dir*stp)*100)/100); save(); render(); return;
  }
  if((b=t.closest('[data-r]'))){
    var id2=b.getAttribute('data-r'), e2=exById(id2), dir2=+b.getAttribute('data-dir');
    var rs = e2.unit==='сек' ? 5 : 1;
    S.reps[id2]=Math.max(1, S.reps[id2]+dir2*rs); save(); render(); return;
  }

  if((b=t.closest('[data-set]'))){
    var sid=b.getAttribute('data-set'), i=+b.getAttribute('data-i');
    var c=ensureCur($('[data-pick][aria-pressed="true"]').getAttribute('data-pick'));
    if(!c.sets[sid]) c.sets[sid]=[];
    c.sets[sid][i] = c.sets[sid][i] ? null : { r:S.reps[sid] };
    save(); render(); return;
  }

  if(t.closest('#finish')){ finish(); return; }
  if(t.closest('#scrap')){ S.cur=null; save(); render(); toast('Сбросил.'); return; }

  if((b=t.closest('[data-day]'))){ selDay=b.getAttribute('data-day'); render(); return; }
  if((b=t.closest('[data-mark]'))){
    var mk=b.getAttribute('data-mark'), dd=b.getAttribute('data-d');
    if(!mk){ delete S.days[dd]; }
    else { S.days[dd]= S.days[dd] ? {t:mk, log:S.days[dd].log} : {t:mk, log:{}}; }
    selDay=dd; save(); render(); return;
  }

  if((b=t.closest('[data-bar]'))){ S.bar=+b.getAttribute('data-bar'); save(); render(); return; }

  if(t.closest('#copy')){
    var txt=JSON.stringify(S);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('Копия в буфере обмена. Сохрани её в заметки.'); },
        function(){ fallbackCopy(txt); });
    } else fallbackCopy(txt);
    return;
  }
  if(t.closest('#showimp')){ var ib=$('#impbox'); ib.hidden=!ib.hidden; return; }
  if(t.closest('#doimp')){
    try{
      var o=JSON.parse($('#imp').value);
      if(!o || o.v!==1 || !o.w) throw 0;
      S=o; save(); render(); toast('Данные восстановлены.');
    }catch(e){ toast('Не получилось прочитать текст. Проверь, что скопировал его целиком.'); }
    return;
  }
});

function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  toast('Копия выделена — нажми «Скопировать» в меню.');
  setTimeout(function(){ document.body.removeChild(ta); }, 12000);
}

document.addEventListener('input', function(ev){
  if(ev.target.id==='calcT'){
    S.calcT=parseFloat(ev.target.value)||0;
    var box=ev.target.closest('.calc'); if(!box) return;
    var st=stack(S.calcT, S.bar), ph=box.querySelector('.plates'), nt=box.querySelector('.calcnote');
    if(st.err){ ph.innerHTML='<div class="calcnote">'+st.err+'</div>'; nt.textContent='Гриф весит '+S.bar+' кг.'; return; }
    ph.innerHTML = st.list.length ? st.list.map(function(p){
      var light=(p===5||p===1.25);
      return '<div class="plate'+(light?' light':'')+'" style="background:'+PCOL[p]+';height:'+(26+Math.min(p,25)*0.62).toFixed(0)+'px">'+kg(p)+'</div>';
    }).join('') : '<div class="calcnote">Пустой гриф.</div>';
    nt.textContent='По '+kg(st.per)+' кг на сторону'+(st.rest>0.01?' · не хватает '+kg(st.rest)+' кг — округли до '+kg(S.calcT-st.rest*2):'')+'. Цвета — стандарт IWF: красный 25, синий 20, жёлтый 15, зелёный 10, белый 5.';
  }
});

render();
})();
</script>
